# Configuration of the no-mistakes pipeline that every change to lean-intent passes through.
#
# `test` is no-mistakes' fixed name for one of its steps and for the key below; lean-intent itself
# has no tests. Every claim the library makes about itself is a theorem Lean's kernel checks, and
# tools/check.lean is the repository's one check program: it builds the library with warnings as
# errors and audits the axioms every declaration rests on, and with --tests it lists the
# repository's tests. no-mistakes honours `test.instructions`, `test.no_surface` and
# `test.tests_as_evidence` only from the copy of this file on the default branch, so a change to
# any of them governs the runs that follow its merge.
#
# Memory. Lean work runs through `no-mistakes admit` with a bound above its peak, so that it waits
# until the bound fits the machine's memory budget beside all other admitted work. Measured on
# 2026-10-27 as the largest sum of resident memory over the processes each ran, which counts the
# .olean files every Lean process maps and so bounds their footprint from above: the check, from a
# clean checkout, 1.7 GiB; the listing, which elaborates tools/check.lean against Lean and Lake,
# 4.8 GiB per side. Measure again when the library grows, and raise a bound before a peak comes
# within 15% of it.
test:
  instructions: |
    On lean-intent this step is verification. A change's claims are established by machine-checked proof, by derivation and by reading; lean-intent has no running product to drive.
    1. Run the repository's checks from the worktree root and cite the command and its exit status: no-mistakes admit --memory 3GiB --limit "none; measured peak 1.7 GiB" -- lean --run tools/check.lean. It exits 0 only when lakefile.toml requires no other package, Lake builds every library module with no error and no warning (a sorry is a warning), and every declaration of the library rests only on Lean's axioms propext, Classical.choice and Quot.sound. tools/check.lean's module comment says what each rule decides; claim no more than that.
    2. Do not write, request or suggest a test, and do not improvise disposable break-it runs as evidence: lean-intent establishes its claims by theorems. A claim about what a theorem states is settled by reading its statement, binders and hypotheses included, never its docstring or name alone.
    3. Report each claim by how it was established: machine-checked (a Lean proof that the check above built; cite the theorem and the command's exit status), argued (by derivation or by reading; cite the file and lines), observed (executed in this run for this claim), assumed (a hypothesis the change relies on; say why it is trusted) or open (not established; say what would establish it and which issue tracks it).
  # lean-intent has no running product; proof, its check and reading settle its claims.
  no_surface: proceed
  # lean-intent adds no tests, and this makes the pipeline hold every change to that. The listing
  # is tools/check.lean run with --tests, which prints one line for each command whose verdict comes
  # from running code on chosen inputs, read through Lean's frontend, and fails rather than printing
  # nothing when it cannot read a file. Its module comment says what it lists and what it does not.
  tests_as_evidence:
    policy: forbid
    list_command: no-mistakes admit --memory 5GiB --limit "none; measured peak 4.8 GiB" -- lean --run tools/check.lean --tests
