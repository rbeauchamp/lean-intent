# Configuration of the no-mistakes pipeline that a change to lean-intent passes through on the
# owner's machine. A cloud session cannot run it: AGENTS.md says what one has done in its place.
#
# `test` is no-mistakes' fixed name for one of its steps and for the key below; lean-intent itself
# has no tests. Every claim the library makes about itself is a theorem Lean's kernel checks, and
# tools/check.lean is the repository's one check program: it builds the library with warnings as
# errors, refuses a Lean file that is not a `module` file, audits the axioms every declaration
# rests on and the runtime functions its compiled code calls, runs the audit of declared types'
# codes over every declaration (through tools/codes.lean, a program it runs because it is not
# itself built against the library), enforces the Lean comment ratchet (`NO-COMMENTS` against
# tools/comment-ratchet.json), runs out-of-tree strict `rbeauchamp/regula` `standard-logical`
# proof-verdict checking (`REGULA` against `tools/regula.pin`), and with --tests it lists the
# repository's tests. no-mistakes
# honours `test.instructions`, `test.no_surface` and `test.tests_as_evidence` only from the copy of
# this file on the default branch, so a change to any of them governs the runs that follow its
# merge.
#
# Memory. Lean work runs through `no-mistakes admit` with a bound above its peak, so that it waits
# until the bound fits the machine's memory budget beside all other admitted work. Measured as the
# largest sum of resident memory over the processes each ran, sampled every 0.1 seconds, which
# counts the .olean files every Lean process maps and so bounds their footprint from above, from a
# clean checkout. Under Lean v4.36.0 on 2026-11-20, on an Apple M5 Max (18 cores, 128 GiB), the
# check with an empty artifact cache peaked at 4.05 GiB (Test mode) and 4.55 GiB (seed mode) in its
# first ten seconds (2.47 GiB when run in an already-built tree), down from 7.05 and 7.25 GiB under
# Lean v4.35.0 on 2026-11-05 (5.43 GiB before the execution check's modules; 4.69 GiB on 2026-10-30
# on a 14-core machine); the 9 GiB bound is kept, well above the 15% margin. The listing, which
# elaborates tools/check.lean against Lean and Lake and runs once per side, peaked at 2.94 and
# 2.95 GiB under Lean v4.36.0 on 2026-11-20 (down from 4.76 GiB under Lean v4.35.0 on 2026-10-30
# and 2026-11-05); the 6 GiB bound is kept. Measure again when the library grows or the toolchain
# changes, and raise a bound before a peak comes within 15% of it. Historically, before migrating
# to compiled `no-comments`, the in-repo comment check (`NO-COMMENTS`), which ran after the build
# and code audit and before library import, read each tracked Lean file in a child process three at
# a time and was then the check's peak: on 2026-11-20 under Lean v4.36.0 on the same machine, the
# check with it peaked at 5.63 GiB, 140 seconds into a run in an already-built tree, sampled every
# 0.2 seconds (measured alone under Lean v4.35.0 over 67 files against a built library, it had
# peaked at 5.52 and 5.46 GiB), which was below the 9 GiB bound by more than 15%. Also before that
# migration, measured on 2026-11-21 under Lean v4.36.0 in a clean tree with an empty artifact cache
# (no `.lake` directory, empty `LAKE_CACHE_DIR`, `LAKE_ARTIFACT_CACHE` unset), sampled every 0.1
# seconds: `tools/check.lean` peaked at 5.523 GiB (5,790,928 KiB, 154.3 seconds in across 4
# processes during the readers), and `--tests` peaked at 3.065 GiB (3,213,552 KiB) in the unbuilt
# clean tree and 3.059 GiB (3,207,232 KiB) after the build. Currently, after migrating NO-COMMENTS
# onto compiled `rbeauchamp/lean-no-comments` `v0.2.0` on 2026-11-21 (pinned in
# `tools/no-comments.pin`, configured in `.no-comments.json`), sampling summed process-group RSS
# every 0.1 seconds on the same machine: standalone `no-comments check` peaked at 1.821 GiB
# (1,909,072 KiB across 5 processes), clean empty-cache `lean --run tools/check.lean` (including
# downloading the v0.2.0 binary) peaked at 4.733 GiB (4,963,136 KiB during the initial build),
# built `tools/check.lean` peaked at 2.535 GiB (2,658,528 KiB), and `--tests` peaked at 2.965 GiB
# (3,108,880 KiB), all well below the kept 9 GiB and 6 GiB bounds with > 15% margin. Currently,
# after wiring out-of-tree `rbeauchamp/regula` `v0.16.0` (`tools/regula.pin`, `standard-logical`) on
# 2026-11-22 on the same machine (`0.1 s` descendant RSS sampling): clean empty-cache
# `lean --run tools/check.lean` (including downloading `no-comments` and cloning/building Regula
# `v0.16.0`) peaked at 8.127 GiB (8,521,984 KiB across 8 processes at 189.7 s during
# `lake build lint`), built/warm-cache `tools/check.lean` peaked at 2.572 GiB (2,696,672 KiB across
# 3 processes at 173.1 s), and `--tests` peaked at 3.050 GiB (3,197,872 KiB across 2 processes at
# 114.3 s). After closing the `debug.byAsSorry` bypass in `testsOfModule` (#94) on 2026-11-22 on
# the same machine (`0.1 s` process-group RSS sampling through `no-mistakes admit`), `--tests`
# peaked at 3.101 GiB (3,251,696 KiB across 3 processes at 166.4 s) and 3.093 GiB (3,243,424 KiB
# across 3 processes at 162.4 s). The check's memory bound is therefore raised from 9 GiB to 11 GiB
# (leaving > 26% headroom above 8.127 GiB), and `--tests` stays at 6 GiB (leaving > 48% headroom
# above 3.101 GiB).
#
# Time. Each check also runs under a wall-clock limit, so that a check that stalls fails and gives
# back its share of the memory budget instead of holding the share and the run until someone stops
# it, as the code audit did for more than an hour on a larger module on 2026-11-05 (issue 59). GNU
# coreutils' timeout runs the check, under Homebrew's name gtimeout (macOS's own /usr/bin/timeout,
# from Apple's shell_cmds, is another program, which this paragraph does not describe), inside
# `no-mistakes admit`, so its clock starts only once the budget admits the check. At the limit it
# sends TERM to the Lean process it started, and KILL 30 seconds later if that process still runs;
# the command then prints the limit and exits with timeout's status, 124, or 137 after a KILL. The
# checks themselves exit only with 0 or 1 or by a signal, so 124 comes from the limit alone.
# `--foreground` keeps timeout in the process group no-mistakes runs the command in, so cancelling
# a run still reaches the check; timeout then signals only the check's own process, and
# no-mistakes ends what is left of the group, the processes the check started, once the command
# exits. The share is released when the last process holding it ends.
#
# Each limit is at least three times the longest duration measured for its check, rounded up to a
# whole minute, so a run up to three times as slow as the slowest measured is never cut off; the
# margin covers runs slowed by heavier load than the measurements saw and the library's growth
# until the next measurement. Measured on 2026-11-20 under Lean v4.36.0 on an Apple M5 Max (18
# cores, 128 GiB), through `no-mistakes admit`, beside other admitted work at a load average of 3.4
# to 7.5, each in a clean tree with an empty artifact cache: the check took 289 seconds as the seed
# build runs it, 294 seconds as the Test command runs it, and 286 seconds when run again in a built
# tree (so most of it is still the audits rather than the build; 3 * 294 = 882 seconds, below the
# kept 1020-second limit derived from v4.35.0 runs of 271–325 seconds at load 3 to 14 on
# 2026-11-05); the listing took 106 seconds after the check and 99 seconds in a clean tree with
# nothing built (3 * 106 = 318 seconds, below the kept 420-second limit derived from v4.35.0 runs
# of 90–123 seconds at load 3 to 14). Measure again when the library grows, the toolchain changes
# or the machine changes, and raise a limit before three times a measured duration passes it.
# Those durations predate the check's comment check (NO-COMMENTS), which measured alone under Lean
# v4.35.0 on 2026-11-20 on the same machine, against a built library, took 47 and 49 seconds. With
# it, on 2026-11-20 under Lean v4.36.0 on the same machine, through `no-mistakes admit`, in one
# worktree whose earlier build was made under Lean v4.35.0: the check took 331 seconds on its
# first run there and 313 seconds when run again in the built tree, at a load average of 4 to 7
# (3 * 331 = 993 seconds, below the 1020-second limit), and the listing then took 130 seconds
# (3 * 130 = 390 seconds, below the 420-second limit). Measured on 2026-11-21 under Lean v4.36.0 on
# the same machine through `no-mistakes admit` in a clean tree with no `.lake` directory and an
# empty artifact cache (load average 2.42 to 5.09): `lean --run tools/check.lean` took 330.65
# seconds (3 * 330.65 = 991.95 seconds, below the kept 1020-second limit), and `lean --run
# tools/check.lean --tests` took 125.28 seconds in the clean unbuilt tree and 126.07 seconds after
# the build (3 * 126.07 = 378.21 seconds, below the kept 420-second limit), so neither limit needed
# raising. After migrating NO-COMMENTS onto compiled `rbeauchamp/lean-no-comments` `v0.2.0` on
# 2026-11-21 on the same machine through `no-mistakes admit`: clean empty-cache
# `lean --run tools/check.lean` (including downloading the v0.2.0 binary) took 328.00 seconds
# (`3 * 328.00 = 984.00` seconds, below 1020), built `lean --run tools/check.lean` took 312.22
# seconds, standalone `no-comments check` took 23.73 seconds, and
# `lean --run tools/check.lean --tests` took 106.40 seconds (`3 * 106.40 = 319.20` seconds, below
# 420). After wiring out-of-tree `rbeauchamp/regula` `v0.16.0` (`tools/regula.pin`,
# `standard-logical`) on 2026-11-22 on the same machine: clean empty-cache
# `lean --run tools/check.lean` took 369.32 seconds (`3 * 369.32 = 1107.96` seconds), built
# `lean --run tools/check.lean` took 320.25 seconds, and `--tests` took 115.95 seconds
# (`3 * 115.95 = 347.85` seconds, below 420). After closing the `debug.byAsSorry` bypass in
# `testsOfModule` (#94) on 2026-11-22 on the same machine through `no-mistakes admit`, `--tests`
# took 168.44 seconds and 164.19 seconds (up from a 125.34-second baseline before #94;
# `3 * 168.44 = 505.32` seconds). The check's wall-clock limit is therefore raised from 1020 to
# 1200 seconds (20 minutes, above `3 * 369.32 = 1107.96` seconds), and `--tests` is raised from
# 420 to 540 seconds (9 minutes, rounded up to a whole minute above `3 * 168.44 = 505.32` seconds).
test:
  instructions: |
    On lean-intent this step is verification. A change's claims are established by machine-checked proof, by derivation and by reading; lean-intent has no running product to drive.
    1. The pipeline has already run the repository's checks in this step, in this run's own checkout of the change, as its configured test command (commands.test in .no-mistakes.yaml); do not run lean --run tools/check.lean, or that command, again. The context above this runbook states that run's result, at this pipeline's version on a line beginning "Configured test command already ran successfully as baseline" when it exited 0, or "Configured test command failed with exit code" followed by its exit status. Cite that run: its command and its exit status. If the context states no result of the configured test command, the checks did not run in this step: report the check open and say so. The configured test command exits 0 only if its listing of tests exits 0 and prints nothing and the check it runs first, through no-mistakes admit, exits 0; that check is lean --run tools/check.lean. It exits 0 only when lakefile.toml requires no other package, Lake builds every library module with no error and no warning (a sorry is a warning), every Lean file Git's index lists is a module file, every declaration of the library rests only on Lean's axioms propext, Classical.choice and Quot.sound, the library's compiled code calls no runtime function that starts a process or asks where it runs or what its environment holds, the audit of declared types' codes (LeanIntent.CodeAudit, run by tools/codes.lean) accepts every declaration of the library, NO-COMMENTS accepts every tracked Lean file against tools/comment-ratchet.json, and out-of-tree Regula (pinned in tools/regula.pin) emits its standard-logical proof-verdict pass on the resolved workspace directory. docs/adr/0001-repository-checks-and-trusted-base.md (with ADR-0002, ADR-0003 and ADR-0004) says what each rule decides; claim no more than that.
    2. Do not write, request or suggest a test, and do not improvise disposable break-it runs as evidence: lean-intent establishes its claims by theorems. A claim about what a theorem states is settled by reading its statement, binders and hypotheses included, never its docstring or name alone.
    3. Report each claim by how it was established: machine-checked (a Lean proof that the check above built; cite the theorem and the command's exit status), argued (by derivation or by reading; cite the file and lines), observed (executed in this run for this claim), assumed (a hypothesis the change relies on; say why it is trusted) or open (not established; say what would establish it and which issue tracks it).
  # lean-intent has no running product; proof, its check and reading settle its claims.
  no_surface: proceed
  # lean-intent adds no tests, and this makes the pipeline hold every change to that. no-mistakes
  # runs the listing in a fresh checkout of a change's head and of its base, whose Git index holds
  # exactly that commit's files. Where the index lists no Lean file, the checkout holds no test,
  # since lean-intent's tests can only be commands in Lean files or a Lake test driver, which needs
  # a Lean module: there the listing prints nothing and exits 0. That is the case of a base that
  # predates tools/check.lean, such as main's first commits, and without it no change could be
  # compared with such a base. Everywhere else the listing runs tools/check.lean with --tests, under
  # the limit the paragraph on time above derives, and fails when that file is missing or cannot
  # run, or when the listing reaches its limit.
  # That program prints one line for each command whose verdict comes from running code on chosen
  # inputs, read through Lean's frontend, and fails rather than printing nothing when it cannot
  # read a file; docs/adr/0002-test-listing-and-pinned-lean-tokens.md says what it lists and what it
  # does not. The guard asks Git the question that program asks for its own list of files,
  # `git ls-files -- '*.lean'`, so it skips the listing only where that list is empty, which the
  # program refuses; and `set -e` ends the command with a status other than 0, never an empty
  # listing, when Git cannot answer. A head with no Lean file still fails the Test command below,
  # which runs tools/check.lean first.
  tests_as_evidence:
    policy: forbid
    list_command: |
      set -e
      lean_files=$(git ls-files -- '*.lean')
      if [ -n "$lean_files" ]; then
        status=0
        no-mistakes admit --memory 6GiB --limit "none; measured peak 3.101 GiB" -- gtimeout --foreground --verbose --kill-after=30 540 lean --run tools/check.lean --tests || status=$?
        case $status in
          124) echo "lean --run tools/check.lean --tests reached its wall-clock limit of 540 seconds and was stopped (.no-mistakes.yaml says how the limit was derived)" >&2 ;;
          137) echo "lean --run tools/check.lean --tests was killed; if timeout reports above that it sent KILL, it reached its wall-clock limit of 540 seconds and did not stop within 30 seconds of TERM" >&2 ;;
        esac
        exit "$status"
      fi

# The merge gate. On 2026-10-28 the owner temporarily set `no_ci: true` so local no-mistakes
# validation acted as the sole merge gate without PR-triggered CI. On 2026-11-21 the owner enabled
# PR-triggered GitHub Actions CI in `.github/workflows/check.yml` (`pull_request` and `push` to
# `main`) and superseded `no_ci: true`; `no_ci: true` is therefore removed so pull requests wait for
# CI alongside local `commands.test` validation. no-mistakes honours `commands`, `no_ci` and
# `build_outputs` only from the copy of this file on the default branch.

# The Test step runs this command first, in the run's own checkout of the change it validates, and
# parks when it exits with any status but 0. It runs every check the repository has, never a part
# chosen by what a change seems to touch: tools/check.lean, and then its listing of tests, which
# must print nothing. The command ends with the status of the first of the two that fails, cannot
# start (`admit` exits 126 or 127), is killed or reaches its wall-clock limit (124, from the
# paragraph on time above), a status other than 0 in every case. Each also fails rather than
# passing when it finds nothing to check: the checks refuse a library with no Lean file or no
# declaration, and the listing a project with no Lean file. The two run one after the other, so
# the command's peak is the larger of the two peaks the paragraph on memory above gives, the
# check's 8.127 GiB (during clean Regula `lake build lint`, up from 4.733 GiB before out-of-tree
# Regula checking), which is below the check's 11 GiB bound by more than 15%.
#
# What a change re-checks is Lake's decision: Lake reuses an earlier output only where its own
# record of the module's inputs matches, the trace in .lake/build or the input hash that finds an
# output in its artifact cache. LAKE_CACHE_DIR names the cache that build_outputs below seeds, so
# Lake never reads its shared default cache in the toolchain's directory. LAKE_ARTIFACT_CACHE is
# unset, so Lake reads that cache, as it does by default, and never writes it. Lake stores no
# build log with a cached output, so a module it takes from the cache into a build directory that
# holds no trace of it replays no warning, and `lake build --wfail` passes it whatever its build
# printed (Lake's traces in .lake/build do keep each build's log). The cache must therefore hold
# only outputs whose build printed no warning: only the seed below writes it, and its outputs are
# stored only when they all built with none.
commands:
  test: |
    set -eu
    export LAKE_CACHE_DIR="$PWD/.lake/cache"
    unset LAKE_ARTIFACT_CACHE
    status=0
    no-mistakes admit --memory 11GiB --limit "none; measured peak 8.127 GiB" -- gtimeout --foreground --verbose --kill-after=30 1200 lean --run tools/check.lean || status=$?
    case $status in
      124) echo "lean --run tools/check.lean reached its wall-clock limit of 1200 seconds and was stopped (.no-mistakes.yaml says how the limit was derived)" >&2 ;;
      137) echo "lean --run tools/check.lean was killed; if timeout reports above that it sent KILL, it reached its wall-clock limit of 1200 seconds and did not stop within 30 seconds of TERM" >&2 ;;
    esac
    [ "$status" -eq 0 ] || exit "$status"
    mkdir -p .lake
    no-mistakes admit --memory 6GiB --limit "none; measured peak 3.101 GiB" -- gtimeout --foreground --verbose --kill-after=30 540 lean --run tools/check.lean --tests > .lake/tests-listing || status=$?
    case $status in
      124) echo "lean --run tools/check.lean --tests reached its wall-clock limit of 540 seconds and was stopped (.no-mistakes.yaml says how the limit was derived)" >&2 ;;
      137) echo "lean --run tools/check.lean --tests was killed; if timeout reports above that it sent KILL, it reached its wall-clock limit of 540 seconds and did not stop within 30 seconds of TERM" >&2 ;;
    esac
    [ "$status" -eq 0 ] || exit "$status"
    if [ -s .lake/tests-listing ]; then
      echo "The listing of tests is not empty; lean-intent establishes its claims by proof:"
      cat .lake/tests-listing
      exit 1
    fi

# The outputs a run starts from: Lake's artifact cache (together with the SHA-256-keyed
# `no-comments` binary staged under `.lake/cache/no-comments/<sha256>/no-comments`, which misses
# cleanly on `tools/no-comments.pin` updates because the path includes the digest, and the
# commit-keyed Regula `v0.16.0` clean source checkout staged under `.lake/cache/regula/<commit>/`,
# which misses cleanly on `tools/regula.pin` updates because the path includes the commit), written
# by the repository's checks run once on a fresh checkout of the run's base commit. no-mistakes
# stores
# the directory only when the command exits 0, and the checks exit 0 only when `lake build --wfail`
# built every library module, each from source since the checkout and the cache start empty, with
# no warning. Each run gets a private copy, used only while lean-toolchain is unchanged, and Lake
# takes an output from it only for a module whose input hash (its source, its imports' outputs,
# its options and the toolchain) is the one that output was built from. no-mistakes does not admit
# this build against the machine's heavy-work budget, so the command admits itself, and it runs
# the checks under the limit the paragraph on time above derives. LAKE_RESTORE_ARTIFACTS has Lake
# put any output it takes from the cache in .lake/build too, where the axiom audit reads it; the
# Test command needs no such setting, because Lake restores every output it takes from a cache it
# only reads.
build_outputs:
  command: |
    status=0
    no-mistakes admit --memory 11GiB --limit "none; measured peak 8.127 GiB" -- env LAKE_CACHE_DIR="$PWD/.lake/cache" LAKE_ARTIFACT_CACHE=true LAKE_RESTORE_ARTIFACTS=true gtimeout --foreground --verbose --kill-after=30 1200 lean --run tools/check.lean || status=$?
    case $status in
      124) echo "lean --run tools/check.lean reached its wall-clock limit of 1200 seconds and was stopped (.no-mistakes.yaml says how the limit was derived)" >&2 ;;
      137) echo "lean --run tools/check.lean was killed; if timeout reports above that it sent KILL, it reached its wall-clock limit of 1200 seconds and did not stop within 30 seconds of TERM" >&2 ;;
    esac
    exit "$status"
  directories:
    - .lake/cache
  toolchain_files:
    - lean-toolchain

# Pull request descriptions. A change's reasons live in its pull request description, which
# becomes its squash commit: its Mission accounting, its decisions, its accepted risks and, for a
# defect fix, its root cause. This template gives every description those sections as top-level
# `#` headings, which no-mistakes requires, with their text and order, in each description it
# drafts from the template; on later runs it keeps the text an author wrote before and after its
# generated appendix and refreshes only the appendix, so a re-push after a rebase or a conflict
# repair no longer drops what an author wrote. no-mistakes honours `pr.template` only from the copy
# of this file on the default branch and reads the template's bytes from the default branch too,
# so a change to either governs the runs that follow its merge. A pull request whose description
# still carries evidence no-mistakes generated before this setting has to be reconciled by hand
# before a run can adopt it ("Author-preserving regeneration" in no-mistakes' repo-config
# reference).
pr:
  template: .github/pull_request_template.md
