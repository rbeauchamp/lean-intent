# Runs the repository's checks (tools/check.lean and empty tools/check.lean --tests) on GitHub's
# machines for every pull request, every push to main, reusable workflow_call runs (such as from
# .github/workflows/release.yml on v* tag pushes), and manual workflow_dispatch runs. Together with
# the local no-mistakes validation (.no-mistakes.yaml, `commands.test`), this enforces all
# repository checks on every change.
#
# Security & merge-base hardening: runs with read-only contents permissions, persist-credentials:
# false, full Git history (fetch-depth: 0), conditional exact-ref population of
# `refs/remotes/origin/main` from `origin`'s verified `refs/heads/main` (`git ls-remote`,
# `git fetch --no-tags`, `FETCH_HEAD` exact-ref/OID check, `FETCH_HEAD^{commit}`, and
# `git update-ref --no-deref`) when absent or not a commit, explicit `--base-ref` distinguishing
# reusable `workflow_call` runs (`github.workflow_ref != job.workflow_ref`, read from `toJSON(job)`,
# failing closed if absent, always using `refs/remotes/origin/main` regardless of caller event) from
# direct `pull_request` (`github.event.pull_request.base.sha`), branch `push` (non-zero
# `github.event.before`, failing closed otherwise), and tag `push` / `workflow_dispatch`
# (`refs/remotes/origin/main`) for NO-COMMENTS merge-base verification, a commit-SHA-pinned checkout
# action, SHA-256 verification of both the Lean release archive paired with lean-toolchain and the
# pinned no-comments binary paired with tools/no-comments.pin (without running an unverified
# curl | sh installer), and exact release tag + commit-SHA verification of out-of-tree Regula paired
# with tools/regula.pin.
name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Ensure refs/remotes/origin/main exists for merge-base check
        shell: bash
        run: |
          set -euo pipefail
          if ! git show-ref --verify --quiet refs/remotes/origin/main || ! git rev-parse --verify --quiet 'refs/remotes/origin/main^{commit}' >/dev/null; then
            LS_REMOTE_OUT="$(git ls-remote --heads --refs origin refs/heads/main)"
            MAIN_OID=""
            MAIN_COUNT=0
            while IFS=$'\t' read -r oid ref; do
              if [ "$ref" = "refs/heads/main" ]; then
                MAIN_OID="$oid"
                MAIN_COUNT=$((MAIN_COUNT + 1))
              fi
            done <<< "$LS_REMOTE_OUT"
            if [ "$MAIN_COUNT" -ne 1 ] || [ -z "$MAIN_OID" ]; then
              echo "Expected unique refs/heads/main on origin" >&2
              exit 1
            fi
            git fetch --no-tags origin refs/heads/main
            FETCH_HEAD_PATH="$(git rev-parse --git-path FETCH_HEAD)"
            if [ "$(wc -l < "$FETCH_HEAD_PATH")" -ne 1 ]; then
              echo "Expected single entry in FETCH_HEAD for refs/heads/main" >&2
              exit 1
            fi
            IFS= read -r FETCH_HEAD_LINE < "$FETCH_HEAD_PATH"
            FETCH_OID="$(git rev-parse --verify FETCH_HEAD)"
            EXPECTED_FETCH_PREFIX="${MAIN_OID}"$'\t\t'"branch 'main' of "
            if [ "$FETCH_OID" != "$MAIN_OID" ] || [ "${FETCH_HEAD_LINE:0:${#EXPECTED_FETCH_PREFIX}}" != "$EXPECTED_FETCH_PREFIX" ]; then
              echo "Fetched object did not resolve from exact refs/heads/main" >&2
              exit 1
            fi
            MAIN_COMMIT="$(git rev-parse --verify 'FETCH_HEAD^{commit}')"
            git update-ref --no-deref refs/remotes/origin/main "$MAIN_COMMIT"
          fi
      - name: Install Lean matching lean-toolchain with SHA-256 verification
        shell: bash
        run: |
          set -euo pipefail
          expected_pin="leanprover/lean4:v4.36.0"
          version="4.36.0"
          sha256="92a996be487b48e1c2f2985be6b150490475c94d02f5a5e26665a9dab780902a"
          if ! printf '%s\n' "$expected_pin" | cmp -s lean-toolchain - \
             && ! printf '%s' "$expected_pin" | cmp -s lean-toolchain -; then
            echo "::error::lean-toolchain does not match pinned release $expected_pin"
            exit 1
          fi
          curl -sSfL --proto '=https' --tlsv1.2 --connect-timeout 15 --retry 2 --retry-delay 2 \
            -o "$RUNNER_TEMP/lean.zip" \
            "https://github.com/leanprover/lean4/releases/download/v${version}/lean-${version}-linux.zip"
          echo "${sha256}  $RUNNER_TEMP/lean.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/lean.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-${version}-linux/bin" >> "$GITHUB_PATH"
      - name: Install no-comments matching tools/no-comments.pin with SHA-256 verification
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f tools/no-comments.pin ] || [ -L tools/no-comments.pin ] || [ -L tools ]; then
            echo "::error::tools/no-comments.pin must be a regular file with no symlink components"
            exit 1
          fi
          seen_version=0
          seen_darwin=0
          seen_linux=0
          pin_version=""
          pin_darwin_sha256=""
          pin_linux_sha256=""
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              *$'\r'*)
                echo "::error::tools/no-comments.pin must use LF line endings"
                exit 1
                ;;
              VERSION=*)
                if [ "$seen_version" -ne 0 ]; then
                  echo "::error::tools/no-comments.pin has duplicate VERSION key"
                  exit 1
                fi
                seen_version=1
                pin_version="${line#VERSION=}"
                ;;
              DARWIN_ARM64_SHA256=*)
                if [ "$seen_darwin" -ne 0 ]; then
                  echo "::error::tools/no-comments.pin has duplicate DARWIN_ARM64_SHA256 key"
                  exit 1
                fi
                seen_darwin=1
                pin_darwin_sha256="${line#DARWIN_ARM64_SHA256=}"
                ;;
              LINUX_X86_64_SHA256=*)
                if [ "$seen_linux" -ne 0 ]; then
                  echo "::error::tools/no-comments.pin has duplicate LINUX_X86_64_SHA256 key"
                  exit 1
                fi
                seen_linux=1
                pin_linux_sha256="${line#LINUX_X86_64_SHA256=}"
                ;;
              *)
                echo "::error::tools/no-comments.pin contains unexpected line"
                exit 1
                ;;
            esac
          done < tools/no-comments.pin
          if [ "$seen_version" -ne 1 ] || [ "$seen_darwin" -ne 1 ] || [ "$seen_linux" -ne 1 ]; then
            echo "::error::tools/no-comments.pin is missing required keys"
            exit 1
          fi
          if ! [[ "$pin_version" =~ ^v[A-Za-z0-9.-]+$ ]] || [[ "$pin_version" == *..* ]]; then
            echo "::error::tools/no-comments.pin has invalid VERSION: $pin_version"
            exit 1
          fi
          if ! [[ "$pin_darwin_sha256" =~ ^[0-9a-f]{64}$ ]] || ! [[ "$pin_linux_sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::tools/no-comments.pin has invalid or missing SHA-256 digest"
            exit 1
          fi
          if [ -L "$RUNNER_TEMP" ] || [ -L "$RUNNER_TEMP/no-comments" ]; then
            echo "::error::RUNNER_TEMP no-comments destination must not be a symlink"
            exit 1
          fi
          curl -sSfL --proto '=https' --tlsv1.2 --connect-timeout 15 --retry 2 --retry-delay 2 \
            -o "$RUNNER_TEMP/no-comments" \
            "https://github.com/rbeauchamp/lean-no-comments/releases/download/${pin_version}/no-comments-linux-x86_64"
          printf '%s  %s\n' "$pin_linux_sha256" "$RUNNER_TEMP/no-comments" | sha256sum --check --strict
          chmod 0755 "$RUNNER_TEMP/no-comments"
          echo "NO_COMMENTS_BIN=$RUNNER_TEMP/no-comments" >> "$GITHUB_ENV"
      - name: Install Regula matching tools/regula.pin with commit verification
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f tools/regula.pin ] || [ -L tools/regula.pin ] || [ -L tools ]; then
            echo "::error::tools/regula.pin must be a regular file with no symlink components"
            exit 1
          fi
          seen_version=0
          seen_commit=0
          pin_version=""
          pin_commit=""
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              *$'\r'*)
                echo "::error::tools/regula.pin must use LF line endings"
                exit 1
                ;;
              VERSION=*)
                if [ "$seen_version" -ne 0 ]; then
                  echo "::error::tools/regula.pin has duplicate VERSION key"
                  exit 1
                fi
                seen_version=1
                pin_version="${line#VERSION=}"
                ;;
              COMMIT=*)
                if [ "$seen_commit" -ne 0 ]; then
                  echo "::error::tools/regula.pin has duplicate COMMIT key"
                  exit 1
                fi
                seen_commit=1
                pin_commit="${line#COMMIT=}"
                ;;
              *)
                echo "::error::tools/regula.pin contains unexpected line"
                exit 1
                ;;
            esac
          done < tools/regula.pin
          if [ "$seen_version" -ne 1 ] || [ "$seen_commit" -ne 1 ]; then
            echo "::error::tools/regula.pin is missing required keys"
            exit 1
          fi
          if ! [[ "$pin_version" =~ ^v[A-Za-z0-9.-]+$ ]] || [[ "$pin_version" == *..* ]]; then
            echo "::error::tools/regula.pin has invalid VERSION: $pin_version"
            exit 1
          fi
          if ! [[ "$pin_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::tools/regula.pin has invalid or missing COMMIT SHA"
            exit 1
          fi
          if [ -L "$RUNNER_TEMP" ] || [ -e "$RUNNER_TEMP/regula" ] || [ -L "$RUNNER_TEMP/regula" ]; then
            echo "::error::RUNNER_TEMP regula destination must not exist or be a symlink"
            exit 1
          fi
          regula_dir="$RUNNER_TEMP/regula"
          mkdir -p "$regula_dir"
          git -C "$regula_dir" init --quiet
          git -C "$regula_dir" fetch --quiet --depth 1 --no-tags -- \
            https://github.com/rbeauchamp/regula.git "refs/tags/${pin_version}:refs/tags/${pin_version}"
          actual_tag_commit="$(git -C "$regula_dir" rev-parse --verify --quiet --end-of-options "refs/tags/${pin_version}^{commit}")"
          if [ "$actual_tag_commit" != "$pin_commit" ]; then
            echo "::error::Regula tag ${pin_version} resolved to ${actual_tag_commit}, expected ${pin_commit}"
            exit 1
          fi
          git -C "$regula_dir" checkout --quiet --detach "$pin_commit"
          actual_head="$(git -C "$regula_dir" rev-parse --verify --quiet --end-of-options "HEAD^{commit}")"
          regula_status="$(git -C "$regula_dir" status --porcelain=v1 --untracked-files=all --ignored)"
          if [ "$actual_head" != "$pin_commit" ] || [ -n "$regula_status" ]; then
            echo "::error::Regula checkout verification failed at ${pin_commit}"
            exit 1
          fi
          echo "REGULA_DIR=$regula_dir" >> "$GITHUB_ENV"
      # LAKE-CONFIG, LEAN-BUILD, LEAN-MODULE, AXIOMS, PROCESS, CODES, NO-COMMENTS, REGULA, LOADED,
      # and READERS: no other package is required, every library module builds with no error and no
      # warning, every Lean file is a `module` file, every declaration rests only on Lean's axioms,
      # the library's compiled code neither starts a process nor asks where it runs, no declaration
      # depends on a declared type's code other than the one its deriving handler writes, every
      # tracked Lean file obeys the comment ratchet in tools/comment-ratchet.json, out-of-tree Regula
      # passes `standard-logical` proof-verdict checking, direct mentions of
      # `importModules`/`finalizeImport` across library declarations (except
      # `LeanIntent.Imported.stored`) and tracked `tools/` files pass `loadExts := true` (with
      # `withImportModules` refused), and every source-written library `.defnInfo`/`.opaqueInfo`
      # whose type transitively holds `Environment` or `Kernel.Environment` begins with
      # `asking`/`askingIn` (without taking an outright `Environment`), takes a `LeanIntent.Loaded`
      # binder, or is in the closed `stateless` list (while admitting compiler-generated
      # declarations nested beneath a source-written prefix; see ADR-0001 and ADR-0009).
      - name: Build the library and audit its axioms
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          JOB_CONTEXT: ${{ toJSON(job) }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          JOB_WORKFLOW_REF="$(jq -er '.workflow_ref | select(type == "string" and length > 0)' <<< "$JOB_CONTEXT" 2>/dev/null || true)"
          if [ -z "$CALLER_WORKFLOW_REF" ] || [ -z "$JOB_WORKFLOW_REF" ]; then
            echo "::error::Missing github.workflow_ref or job.workflow_ref to distinguish direct and workflow_call runs"
            exit 1
          fi
          if [ "$CALLER_WORKFLOW_REF" != "$JOB_WORKFLOW_REF" ]; then
            lean --run tools/check.lean --base-ref refs/remotes/origin/main
          else
            case "$EVENT_NAME" in
              pull_request)
                if [ -z "$PR_BASE_SHA" ]; then
                  echo "::error::Missing pull_request.base.sha for NO-COMMENTS --base-ref"
                  exit 1
                fi
                lean --run tools/check.lean --base-ref "$PR_BASE_SHA"
                ;;
              push)
                if [ "$REF_TYPE" = "tag" ]; then
                  lean --run tools/check.lean --base-ref refs/remotes/origin/main
                elif [ "$REF_TYPE" = "branch" ]; then
                  if [ -z "$PUSH_BEFORE_SHA" ] || [ "$PUSH_BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
                    echo "::error::Missing non-zero push before SHA for NO-COMMENTS --base-ref"
                    exit 1
                  fi
                  lean --run tools/check.lean --base-ref "$PUSH_BEFORE_SHA"
                else
                  echo "::error::Unsupported push ref_type for NO-COMMENTS --base-ref: $REF_TYPE"
                  exit 1
                fi
                ;;
              workflow_dispatch)
                lean --run tools/check.lean --base-ref refs/remotes/origin/main
                ;;
              *)
                echo "::error::Unsupported GitHub Actions event: $EVENT_NAME"
                exit 1
                ;;
            esac
          fi
      # The repository establishes its claims by proof, so its listing of tests is empty.
      - name: Check that the repository has no tests
        shell: bash
        run: |
          set -euo pipefail
          lean --run tools/check.lean --tests > "$RUNNER_TEMP/tests"
          if [ -s "$RUNNER_TEMP/tests" ]; then
            echo "The listing of tests is not empty; lean-intent establishes its claims by proof:"
            cat "$RUNNER_TEMP/tests"
            exit 1
          fi
